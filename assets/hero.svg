<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Einstein-skill</title>
  <desc id="desc">Think first. Build less. Prove it. A focused workflow for AI agents.</desc>
  <defs>
    <linearGradient id="background" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#0c1424"/>
      <stop offset="1" stop-color="#080c14"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop stop-color="#a5b4fc"/>
      <stop offset="1" stop-color="#67e8f9"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#253149" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="640" rx="24" fill="url(#background)"/>
  <rect x="740" width="540" height="640" fill="url(#grid)" opacity="0.42"/>
  <path d="M72 80h38" stroke="#a5b4fc" stroke-width="4"/>
  <text x="127" y="87" fill="#b8c6dc" font-family="Arial, sans-serif" font-size="18" letter-spacing="3">AI WORKFLOW / EINSTEIN-SKILL</text>
  <text x="72" y="218" fill="#f1f5ff" font-family="Arial, sans-serif" font-weight="700" font-size="82" letter-spacing="-3">Think first.</text>
  <text x="72" y="311" fill="#f1f5ff" font-family="Arial, sans-serif" font-weight="700" font-size="82" letter-spacing="-3">Build less.</text>
  <text x="72" y="404" fill="url(#accent)" font-family="Arial, sans-serif" font-weight="700" font-size="82" letter-spacing="-3">Prove it.</text>
  <text x="75" y="470" fill="#9facc1" font-family="Arial, sans-serif" font-size="23">Clear assumptions. Focused changes. Real evidence.</text>
  <rect x="74" y="528" width="272" height="40" rx="20" fill="#172238" stroke="#34445f"/>
  <text x="95" y="554" fill="#c8d5ea" font-family="Arial, sans-serif" font-size="16">OPEN SOURCE / AGENT SKILLS</text>
  <g transform="translate(942 310)">
    <circle r="140" fill="#0e192b" stroke="#2e405f"/>
    <ellipse rx="175" ry="57" fill="none" stroke="#6d7fb0" stroke-width="2" transform="rotate(-35)"/>
    <ellipse rx="175" ry="57" fill="none" stroke="#6d7fb0" stroke-width="2" transform="rotate(35)"/>
    <circle cx="143" cy="-86" r="8" fill="#67e8f9"/>
    <circle cx="-139" cy="-89" r="8" fill="#a5b4fc"/>
